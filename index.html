<!DOCTYPE html> <!--Versao mais nova do html-->

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Sabor Real</title>

    <!--
    Link = Conectar
    stylesheet -  Folha de estilo (CSS)
    href - referencia / caminho do arquivo 
    -->

</head>

<body>

    <header>

        <div class="logo">
            <i class="fa-solid fa-utensils"></i>
            <h1>Sabor Real</h1>
        </div>

        <div class="container-busca">
            <input placeholder="Pesquisar produtos" class="input-pesquisa">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>

    </header>


    <div class="container-categorias">
        <nav>
            <button class="botao-categorias" data-categoria="Todos">
                <i class="fa-solid fa-border-all"></i>
                Todos
            </button>

            <button class="botao-categorias" data-categoria="Smartphones">
                <i class="fa-solid fa-mobile-screen-button"></i>
                Smartphones
            </button>

            <button class="botao-categorias" data-categoria="Notebooks">
                <i class="fa-solid fa-laptop"></i>
                Notebooks
            </button>

            <button class="botao-categorias" data-categoria="Tvs">
                <i class="fa-solid fa-tv"></i>
                Tvs
            </button>

            <button class="botao-categorias" data-categoria="Fones>
                <i class="fa-solid fa-headphones-simple"></i>
                Fones
            </button>

            <button class="botao-categorias" data-categoria="Teclados">
                <i class="fa-solid fa-keyboard"></i>
                Teclados
            </button>

        </nav>

    </div>

    <div class="secao-hero">
        <h2>Black Friday Antecipada !</h2>
        <p>Até 50% de desconto</p>
    </div>

    <div class="produtos">
        <div class="produtos-container">
        </div>
    </div>


    <footer>
        <p>2025 - Todos os direitos reservados</p>
    </footer>

</body>

<script src="scripts.js">
    // src = source / origem do arquivo
</script>
</html>
